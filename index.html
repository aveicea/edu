<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정보과 각론 퀴즈</title>
<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --card2:#f4f6fb; --border:#dde3ee;
    --text:#1c2434; --muted:#6b7386; --accent:#3d6ee0; --accent2:#2f56b8;
    --ok:#1f9d63; --bad:#d93a52; --warn:#c97e18;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Pretendard,sans-serif;
    background:#ffffff; color:var(--text); min-height:100vh; padding:24px;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  textarea, input{ user-select:text; -webkit-user-select:text; }
  .wrap{max-width:900px; margin:0 auto;}
  h1{font-size:22px; margin:0 0 4px; letter-spacing:-0.02em;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:20px;}
  .navlinks{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; font-size:14px; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
  .navlink{color:var(--muted); cursor:pointer; transition:.15s; padding-bottom:2px; border-bottom:2px solid transparent;}
  .navlink.active{color:var(--text); font-weight:700; border-bottom-color:var(--accent);}
  .navlink:hover:not(.active){color:var(--text);}
  .navsep{color:var(--border); user-select:none; -webkit-user-select:none; pointer-events:none;}
  .panel{display:none;}
  .panel.active{display:block;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:0; margin-bottom:16px;
    box-shadow:0 1px 3px rgba(30,40,70,.06); overflow:hidden;
  }
  .typetabs{
    display:flex; gap:6px; margin-bottom:14px; flex-wrap:nowrap;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin;
    padding-bottom:4px;
  }
  .typetabs::-webkit-scrollbar{ height:4px; }
  .typetabs::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  .subjtab, .typetab{
    flex:0 0 auto; white-space:nowrap; cursor:pointer; transition:.15s; font-weight:600;
    background:var(--card); border:1px solid var(--border); color:var(--muted);
  }
  .subjtab{ padding:7px 13px; border-radius:20px; font-size:12.5px; }
  .typetab{ padding:5px 11px; border-radius:16px; font-size:11.5px; }
  .subjtab.active{background:var(--accent); color:white; border-color:var(--accent);}
  .subjtab:hover:not(.active){background:var(--card2); color:var(--text);}
  .typetab.active{background:var(--accent2); color:white; border-color:var(--accent2);}
  .typetab:hover:not(.active){background:var(--card2); color:var(--text);}

  .typetabs-row{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .type-selector-tabs{margin-bottom:0;}
  .subj-toggle-wrap{position:relative; flex:0 0 auto;}
  .subj-toggle-btn{display:inline-flex; align-items:center; gap:4px;}
  .subj-toggle-caret{font-size:9px; opacity:.85;}
  .subj-dropdown{
    position:absolute; top:calc(100% + 6px); left:0; z-index:20;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 6px 20px rgba(30,40,70,.14); padding:6px;
    display:none; flex-direction:column; gap:2px; min-width:150px;
  }
  .subj-dropdown.open{display:flex;}
  .subj-dropdown-item{padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; color:var(--text); cursor:pointer; white-space:nowrap; transition:.12s;}
  .subj-dropdown-item:hover{background:var(--card2);}
  .subj-dropdown-item.active{background:var(--accent); color:#fff;}
  .subj-dropdown-item.multi{display:flex; align-items:center; gap:8px;}
  .subj-dropdown-item.multi .chk{width:14px; height:14px; border-radius:4px; border:1.5px solid var(--border); flex:0 0 auto; position:relative;}
  .subj-dropdown-item.multi.active .chk{border-color:#fff; background:rgba(255,255,255,.25);}
  .subj-dropdown-item.multi.active .chk::after{content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff;}

  .memo-toolbar{ display:flex; justify-content:flex-end; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); }
  .pen-colors{ display:flex; gap:4px; align-items:center; }
  .pen-color{ width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border); cursor:pointer; padding:0; transition:.12s; }
  .pen-color.active{ border-color:var(--text); transform:scale(1.2); }
  .pen-color.eraser{ background:#fff; border-radius:4px; }
  .memo-btn{ font-size:11px; padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; transition:.12s; white-space:nowrap; }
  .memo-btn:hover{ background:var(--card2); color:var(--text); }
  .memo-stage{ position:relative; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; min-height:260px; }
  .memo-canvas-overlay{
    position:absolute; inset:0; width:100%; height:100%; touch-action:none;
    z-index:8; cursor:crosshair; user-select:none; -webkit-user-select:none;
  }
  .problem-info{ position:relative; z-index:2; pointer-events:none; padding:20px 24px 24px 24px; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .problem-info *{ user-select:none; -webkit-user-select:none; }
  .problem-info input[type=text]{ user-select:text; -webkit-user-select:text; }
  .problem-info .choicerow, .problem-info .choicebtn, .problem-info .actionrow, .problem-info .actbtn, .problem-info .blankinput{ pointer-events:auto; position:relative; z-index:6; }

  .typelabel{font-size:12px; color:var(--accent2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; font-weight:700;}
  .qmeta{font-size:11.5px; color:var(--muted); margin-bottom:10px;}
  .qprompt{font-size:16px; font-weight:600; line-height:1.6; margin-bottom:4px;}
  .qprompt b{color:var(--accent2);}

  .choicerow{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .choicebtn{
    display:block; width:100%;
    padding:12px 16px; border-radius:10px; border:2px solid var(--border);
    background:var(--card2); color:var(--text); font-weight:600; font-size:14px; cursor:pointer; transition:.12s;
    text-align:left;
  }
  .choicebtn:hover:not(:disabled){filter:brightness(1.2);}
  .choicebtn:disabled{opacity:.55; cursor:default;}
  .choicebtn.correct{background:var(--ok); border-color:var(--ok); color:#fff; opacity:1;}
  .choicebtn.wrong{background:var(--bad); border-color:var(--bad); color:#fff; opacity:1;}

  .blankline{font-size:15.5px; line-height:2.1; margin:16px 0 6px; overflow-wrap:break-word;}
  .blankinput{
    display:inline-block; box-sizing:border-box; max-width:100%; min-width:90px; border:none; border-bottom:2px solid var(--accent);
    background:transparent; font-weight:700; color:var(--accent2); padding:3px 4px;
    font-size:14.5px; text-align:center; border-radius:0; margin:0 2px;
  }
  .blankinput:disabled{color:var(--text); background:transparent;}
  .blankinput.correct{background:transparent; border-bottom-color:var(--ok); color:var(--ok);}
  .blankinput.wrong{background:transparent; border-bottom-color:var(--bad); color:var(--bad);}
  .blankgroup{display:inline-flex; flex-wrap:wrap; max-width:100%; align-items:baseline; gap:4px;}
  .blankgroup .blankinput{min-width:60px; width:80px;}
  .unitinput-field{display:block; width:100%; max-width:340px; min-width:0; font-size:16px;}
  .blanksep{color:var(--muted); margin:0 2px;}

  .actionrow{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .actbtn{
    padding:10px 16px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--muted);
    cursor:pointer; font-size:13px; font-weight:600; transition:.12s;
  }
  .actbtn:hover{background:var(--card2); color:var(--text);}
  .actbtn.primary{background:var(--accent); color:white; border-color:var(--accent);}
  .actbtn.primary:hover{background:var(--accent2);}

  .feedback{margin-top:14px; border-radius:10px; padding:14px 16px; font-size:14px; line-height:1.8; display:none;}
  .feedback.show{display:block;}
  .feedback.correct{background:rgba(31,157,99,.12); border:1px solid var(--ok);}
  .feedback.wrong{background:rgba(217,58,82,.12); border:1px solid var(--bad);}
  .feedback .fbtitle{font-weight:700; font-size:15px; margin-bottom:6px;}
  .feedback .fbtitle.ok{color:var(--ok);}
  .feedback .fbtitle.no{color:var(--bad);}
  .feedback .fbans{font-size:13px; color:var(--muted); margin-top:4px;}
  .feedback .fbans b{color:var(--text);}

  .tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px;}
  .tag.ok{background:var(--ok); color:#fff;}
  .tag.no{background:var(--bad); color:white;}

  .notice{font-size:12px; color:var(--muted); background:#f4f6fb; border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}
  .notice.hidden{display:none;}
  .notice-close{background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; padding:0; width:20px; height:20px; display:flex; align-items:center; justify-content:center;}
  .notice-close:hover{color:var(--text);}

  /* 오답노트 */
  .notes-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .notes-count{font-size:13px; color:var(--muted);}
  .notelist{display:flex; flex-direction:column; gap:12px;}
  .noteitem{background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; position:relative;}
  .noteitem .nhead{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--card2); border-bottom:1px solid var(--border);}
  .noteitem .ndate{color:var(--muted); font-size:11px;}
  .noteitem .ntype{font-size:11px; font-weight:700; color:var(--accent2);}
  .noteitem .ndel{background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:2px 6px;}
  .noteitem .ndel:hover{color:var(--bad);}
  .note-stage{ position:relative; padding:14px 16px 16px; }
  .note-stage .qprompt{font-size:14px;}
  .note-stage .choicerow{display:grid; grid-template-columns:1fr 1fr;}
  .note-stage .choicebtn{font-size:12.5px; padding:8px 12px;}
  .note-stage .blankline{font-size:13.5px;}
  .note-stage .blankinput{font-size:13px; min-width:90px;}
  @media (max-width:480px){
    .note-stage .choicerow{grid-template-columns:1fr;}
  }
  .nmemo-overlay{position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none;}
  .nmemo-overlay img{ width:100%; height:100%; object-fit:fill; display:block; }
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:40px 0;}

  /* 통계 */
  .stats-summary{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;}
  .statbox{flex:1; min-width:120px; background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:14px 16px; text-align:center;}
  .statbox .snum{font-size:24px; font-weight:800; color:var(--text);}
  .statbox .slabel{font-size:12px; color:var(--muted); margin-top:2px;}
  .statbox.ok .snum{color:var(--ok);}
  .statbox.bad .snum{color:var(--bad);}
  .stats-bysubject{display:flex; flex-direction:column; gap:10px;}
  .subjbar-row{display:flex; align-items:center; gap:10px; font-size:13px;}
  .subjbar-row .sname{width:150px; flex-shrink:0; color:var(--text); font-weight:600;}
  .subjbar-track{flex:1; height:10px; background:var(--card2); border-radius:6px; overflow:hidden; border:1px solid var(--border);}
  .subjbar-fill{height:100%; background:var(--accent); border-radius:6px;}
  .subjbar-count{width:70px; flex-shrink:0; text-align:right; color:var(--muted); font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>2022 교육과정</h1>

  <div class="navlinks">
    <span class="navlink active" data-tab="all">전체 범위</span>
    <span class="navsep">|</span>
    <span class="navlink" data-tab="subject">과목별</span>
    <span class="navsep">|</span>
    <span class="navlink" data-tab="notes">오답노트</span>
    <span class="navsep">|</span>
    <span class="navlink" data-tab="stats">통계</span>
  </div>

  <!-- ALL TAB -->
  <div class="panel active" id="panel-all">
    <div class="notice" id="all-notice">
      <span>여러 과목을 섞어 무작위로 출제합니다. 문제 위에 손가락/펜으로 필기할 수 있어요.</span>
      <button class="notice-close" id="all-notice-close">×</button>
    </div>
    <div class="typetabs-row" id="all-selector-row">
      <div class="subj-toggle-wrap" id="all-subj-toggle-wrap">
        <div class="subjtab active subj-toggle-btn" id="all-subj-toggle-btn"></div>
        <div class="subj-dropdown" id="all-subj-dropdown"></div>
      </div>
      <div class="typetabs type-selector-tabs" id="all-type-selector"></div>
    </div>
    <div class="card">
      <div class="memo-toolbar">
        <div class="pen-colors" id="all-pen-colors">
          <button class="pen-color active" data-color="#333333" style="background:#333333;" title="검정"></button>
          <button class="pen-color" data-color="#9aa0ab" style="background:#9aa0ab;" title="회색"></button>
          <button class="pen-color" data-color="#e02b3d" style="background:#e02b3d;" title="빨강"></button>
          <button class="pen-color" data-color="#2f6ee0" style="background:#2f6ee0;" title="파랑"></button>
          <button class="pen-color eraser" data-color="eraser" title="지우개"></button>
        </div>
        <button class="memo-btn" id="all-memo-clear">메모 지우기</button>
      </div>
      <div class="memo-stage" id="all-memo-stage">
        <canvas class="memo-canvas-overlay" id="all-memo-canvas"></canvas>
        <div class="problem-info" id="all-quizarea"></div>
      </div>
    </div>
  </div>

  <!-- SUBJECT TAB -->
  <div class="panel" id="panel-subject">
    <div class="typetabs-row" id="type-selector">
      <div class="subj-toggle-wrap" id="subj-toggle-wrap">
        <div class="subjtab active subj-toggle-btn" id="subj-toggle-btn"></div>
        <div class="subj-dropdown" id="subj-dropdown"></div>
      </div>
      <div class="typetabs type-selector-tabs" id="type-selector-tabs"></div>
    </div>
    <div class="card">
      <div class="memo-toolbar">
        <div class="pen-colors" id="subj-pen-colors">
          <button class="pen-color active" data-color="#333333" style="background:#333333;" title="검정"></button>
          <button class="pen-color" data-color="#9aa0ab" style="background:#9aa0ab;" title="회색"></button>
          <button class="pen-color" data-color="#e02b3d" style="background:#e02b3d;" title="빨강"></button>
          <button class="pen-color" data-color="#2f6ee0" style="background:#2f6ee0;" title="파랑"></button>
          <button class="pen-color eraser" data-color="eraser" title="지우개"></button>
        </div>
        <button class="memo-btn" id="subj-memo-clear">메모 지우기</button>
      </div>
      <div class="memo-stage" id="subj-memo-stage">
        <canvas class="memo-canvas-overlay" id="subj-memo-canvas"></canvas>
        <div class="problem-info" id="subj-quizarea"></div>
      </div>
    </div>
  </div>

  <!-- NOTES TAB -->
  <div class="panel" id="panel-notes">
    <div class="notice" id="notes-notice">
      <span>오답노트는 이 브라우저의 localStorage에 자동 저장됩니다. 틀린 문제의 정답과 필기가 함께 남습니다.</span>
      <button class="notice-close" id="notes-notice-close">×</button>
    </div>
    <div class="notes-toolbar">
      <span class="notes-count" id="notes-count">0개</span>
      <button class="actbtn" id="notes-clear-all">전체 지우기</button>
    </div>
    <div class="notelist" id="notes-list"></div>
  </div>

  <!-- STATS TAB -->
  <div class="panel" id="panel-stats">
    <div class="card" style="padding:20px 24px;">
      <div class="stats-summary" id="stats-summary"></div>
      <div class="stats-bysubject" id="stats-bysubject"></div>
      <div class="actionrow">
        <button class="actbtn" id="stats-reset">통계 초기화</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===================== 데이터 ===================== */
const DATA = [
  {
    id:'mid', name:'중학교 정보', codePrefix:'9정',
    units:[
      {
        id:'mid-1', name:'컴퓨팅 시스템',
        coreIdeas:[
          '하드웨어와 소프트웨어의 유기적 연결을 통해 동작하는 컴퓨팅 시스템은 사회적, 기술적 가치를 높이는 데 활용된다.',
          '컴퓨팅 시스템을 설계하는 것은 시스템에 대한 전체 흐름과 자원 할당의 가치를 이해하는 데 도움을 준다.'
        ],
        content:{
          지식이해:['컴퓨팅 시스템의 동작 원리','운영 체제의 기능','피지컬 컴퓨팅의 개념'],
          과정기능:['컴퓨팅 시스템의 구성요소를 파악하고, 동작 원리를 운영 체제와 관계짓기','생활 속에서 피지컬 컴퓨팅이 적용된 사례 조사하기','피지컬 컴퓨팅 시스템 구성하기'],
          가치태도:['컴퓨팅 시스템의 필요성과 가치를 판단하는 자세','피지컬 컴퓨팅 시스템의 구성요소를 목적에 맞게 선택하는 유연한 태도']
        },
        standards:[
          {code:'9정01-01', text:'컴퓨팅 시스템의 구성요소와 동작 원리를 이해하고, 운영 체제의 기능을 분석한다.'},
          {code:'9정01-02', text:'피지컬 컴퓨팅의 개념을 이해하고, 생활 속에서 적용된 사례 조사를 통해 컴퓨팅 시스템의 필요성과 가치를 판단한다.'},
          {code:'9정01-03', text:'문제 해결 목적에 맞는 피지컬 컴퓨팅 구성요소를 선택하여 시스템을 구상한다.'}
        ],
        blanks:[
          {text:'컴퓨팅 시스템은 컴퓨터라는 특정한 기기에서 더욱 큰 범위의 시스템으로 확장되었음을 인식하고, 현실 세계에서 볼 수 있는 다양한 컴퓨팅 시스템이 문제를 해결하는 방식을 설명할 수 있어야 한다.', answers:['더욱 큰 범위의 시스템']},
          {text:'다양한 구성요소가 컴퓨팅 시스템에서 고유한 역할을 담당하고 있음을 이해하고, 목적에 맞는 물리적인 장치와 소프트웨어를 결합하여 피지컬 컴퓨팅 시스템을 구현하는 과정을 통해 사회의 다양한 영역에서 피지컬 컴퓨팅 시스템이 유용하게 사용될 수 있음을 판단할 수 있어야 한다.', answers:['물리적인 장치와 소프트웨어를 결합하여 피지컬 컴퓨팅 시스템을 구현하는']},
          {text:'실생활에서 관찰할 수 있는 구체적인 컴퓨팅 시스템의 예시를 적극적으로 활용하여 나의 삶과 컴퓨팅 시스템이 괴리되어 있지 않음을 인식하도록 유도한다.', answers:['나의 삶과 컴퓨팅 시스템이 괴리되어 있지 않음']}
        ]
      },
      {
        id:'mid-2', name:'데이터',

/* ===================== 유틸 ===================== */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function sample(arr,n){ return shuffle(arr).slice(0,Math.min(n,arr.length)); }
function normalize(s){ return (s||'').replace(/\s+/g,'').replace(/[,.\u22c5·⋅()]/g,'').toLowerCase(); }

function flattenUnits(){
  const list = [];
  DATA.forEach(s=>{
    s.units.forEach(u=>{
      list.push(Object.assign({}, u, {subjectId:s.id, subjectName:s.name}));
    });
  });
  return list;
}

const SUBJECT_ABBR = { mid:'중정보', high:'고정보', ai:'인기초', data:'데과', sw:'소생' };

function unitLabel(u, withSubject){
  return withSubject ? (u.subjectName + ' · ' + u.name) : u.name;
}

/* ===================== 저장소 (localStorage) ===================== */
const STORAGE_PREFIX = 'infoquiz_';
async function storageGet(key){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
    return true;
  }catch(e){ return false; }
}

/* ===================== 문제 생성 엔진 ===================== */
// pool: unit[] (전체 또는 특정 과목), crossSubject: pool 안에 여러 과목이 섞여있는지 여부
function contentItemPool(unit){
  const items = [];
  ['지식이해','과정기능','가치태도'].forEach(cat=>{
    (unit.content[cat]||[]).forEach(t=> items.push({text:t, cat}));
  });
  return items;
}

function genTypeAForward(pool, crossSubject){
  const unitsWithContent = pool.filter(u=> contentItemPool(u).length>0);
  const unit = pick(unitsWithContent);
  const items = contentItemPool(unit).filter(it=>it.cat==='지식이해');
  const pickItems = items.length ? items : contentItemPool(unit);
  const item = pick(pickItems);

  return {
    kind:'unitinput',
    typeLabel:'유형 A · 내용 요소로 단원 맞히기',
    promptHtml:(crossSubject ? '다음은 어떤 단원의 내용 요소(' : '[' + unit.subjectName + ']의 어떤 단원 내용 요소(') + item.cat + ')일까요? <span style="color:var(--muted); font-weight:400;">(단원명을 입력하세요)</span><br><b>"' + item.text + '"</b>',
    correctAnswer: unit.name,
    meta:{unit}
  };
}

function genTypeAReverse(pool, crossSubject){
  const unitsWithContent = pool.filter(u=> contentItemPool(u).length>0);
  const unit = pick(unitsWithContent);
  const items = contentItemPool(unit).filter(it=>it.cat==='지식이해');
  const pickItems = items.length ? items : contentItemPool(unit);
  const correctItem = pick(pickItems);

  // 다른 단원(같은 항목 유형)에서 오답 후보 수집
  const otherTexts = [];
  pool.forEach(u=>{
    if(u.id===unit.id) return;
    contentItemPool(u).filter(it=>it.cat===correctItem.cat).forEach(it=> otherTexts.push(it.text));
  });
  let distractorTexts = sample(otherTexts, Math.min(4, otherTexts.length));
  if(distractorTexts.length < 3){
    // 같은 유형이 부족하면 전체 항목에서 보충
    const anyTexts = [];
    pool.forEach(u=>{
      if(u.id===unit.id) return;
      contentItemPool(u).forEach(it=>{ if(!distractorTexts.includes(it.text)) anyTexts.push(it.text); });
    });
    distractorTexts = distractorTexts.concat(sample(anyTexts, 4-distractorTexts.length));
  }
  const choices = shuffle([{label:correctItem.text, correct:true}].concat(
    distractorTexts.map(t=>({label:t, correct:false}))
  ));

  const unitDesc = crossSubject ? ('[' + unit.subjectName + ' · ' + unit.name + ']') : ('[' + unit.subjectName + ']의 [' + unit.name + ']');

  return {
    kind:'choice',
    typeLabel:'유형 A · 단원으로 내용 요소 맞히기',
    promptHtml: unitDesc + ' 단원의 내용 요소(' + correctItem.cat + ')로 알맞은 것은 무엇일까요?',
    choices, meta:{unit}
  };
}

function genTypeA(pool, crossSubject){
  return Math.random() < 0.5 ? genTypeAForward(pool, crossSubject) : genTypeAReverse(pool, crossSubject);
}



function genTypeB(pool, crossSubject){
  const unit = pick(pool);
  const idea = pick(unit.coreIdeas);

  return {
    kind:'unitinput',
    typeLabel:'유형 B · 핵심 아이디어로 단원 분류하기',
    promptHtml:(crossSubject ? '다음 핵심 아이디어는 어느 단원의 것일까요?' : '다음 핵심 아이디어는 [' + unit.subjectName + ']의 어느 단원일까요?') + ' <span style="color:var(--muted); font-weight:400;">(단원명을 입력하세요)</span><br><b>"' + idea + '"</b>',
    correctAnswer: unit.name,
    meta:{unit}
  };
}

// 콤마로 이어진 정답("지지도, 신뢰도, 향상도")을 하위 항목 배열로 분리
function splitAnswerParts(ans){
  return ans.split(',').map(s=>s.trim()).filter(s=>s.length);
}

function genTypeC(pool){
  const withBlanks = pool.filter(u=> u.blanks && u.blanks.length);
  const unit = pick(withBlanks);
  const entry = pick(unit.blanks);
  let display = entry.text;
  entry.answers.forEach((ans, i)=>{
    display = display.replace(ans, '{{BLANK' + i + '}}');
  });
  const parts = display.split(/(\{\{BLANK\d+\}\})/g);
  // 각 blank의 하위 항목 목록 (콤마 분리)
  const answerGroups = entry.answers.map(splitAnswerParts);

  return {
    kind:'blank',
    typeLabel:'유형 C · 빈칸 채우기',
    promptHtml:'다음 문장의 빈칸을 채우세요. <span style="color:var(--muted); font-weight:400;">(' + unit.subjectName + ' · ' + unit.name + ')</span>',
    parts, answers: entry.answers, answerGroups,
    meta:{unit}
  };
}

function genTypeD(pool, crossSubject){
  const unit = pick(pool);
  const standard = pick(unit.standards);

  const otherStandards = [];
  pool.forEach(u=>{
    if(u.id===unit.id) return;
    (u.standards||[]).forEach(s=> otherStandards.push(s.text));
  });
  const distractors = sample(otherStandards, 3);
  const choices = shuffle([{label:standard.text, correct:true}].concat(
    distractors.map(t=>({label:t, correct:false}))
  ));
  return {
    kind:'choice',
    typeLabel:'유형 D · 성취기준 코드 맞히기',
    promptHtml:'성취기준 코드 <b>[' + standard.code + ']</b>에 해당하는 문장은 무엇일까요?',
    choices, meta:{unit}
  };
}

function generateQuestion(pool, crossSubject, forceType){
  const types = ['A','B','C','D'];
  const hasBlanks = pool.some(u=>u.blanks && u.blanks.length);
  const usable = hasBlanks ? types : types.filter(t=>t!=='C');
  let type = forceType;
  if(!type || !usable.includes(type)) type = pick(usable);
  if(type==='A') return genTypeA(pool, crossSubject);
  if(type==='B') return genTypeB(pool, crossSubject);
  if(type==='C') return genTypeC(pool);
  return genTypeD(pool, crossSubject);
}

/* ===================== 메모 캔버스 (필기) ===================== */
// 캔버스 위에서 탭한 요소를 활성화: 텍스트 입력칸은 focus(키보드 표시), 그 외 버튼류는 click
function activateTapTarget(el){
  const tag = (el.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea'){
    el.focus();
    if(el.select) el.select();
  } else {
    el.click();
  }
}

function setupMemoCanvas(canvasId, stageId, tapSelector){
  const canvas = document.getElementById(canvasId);
  const stage = document.getElementById(stageId);
  const ctx = canvas.getContext('2d', { desynchronized: true }) || canvas.getContext('2d');
  let drawing = false;
  let hasContent = false;
  let penColor = '#333333';
  let eraser = false;

  let strokes = [];
  let curStroke = null;
  let bgImage = null;
  let bgW = 0, bgH = 0;
  let cssW = 0, cssH = 0;

  function drawStrokePath(s){
    const pts = s.pts;
    if(!pts.length) return;
    ctx.strokeStyle = s.color;
    if(pts.length === 1){
      ctx.lineWidth = pts[0].w;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      ctx.lineTo(pts[0].x + 0.01, pts[0].y + 0.01);
      ctx.stroke();
      return;
    }
    for(let i=1;i<pts.length;i++){
      const a = pts[i-1], b = pts[i];
      ctx.lineWidth = b.w;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      const mid = { x:(a.x + b.x)/2, y:(a.y + b.y)/2 };
      ctx.quadraticCurveTo(a.x, a.y, mid.x, mid.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  function redraw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if(bgImage) ctx.drawImage(bgImage, 0, 0, bgW || cssW, bgH || cssH);
    for(const s of strokes) drawStrokePath(s);
  }

  function distToSeg(p, a, b){
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx*dx + dy*dy;
    if(len2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
    let t = ((p.x - a.x)*dx + (p.y - a.y)*dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (a.x + t*dx), p.y - (a.y + t*dy));
  }

  function eraseAt(p){
    const r = 14;
    let changed = false;
    for(let i=strokes.length-1;i>=0;i--){
      const s = strokes[i];
      let hit = false;
      for(const pt of s.pts){
        if(Math.hypot(pt.x - p.x, pt.y - p.y) <= r + (pt.w||2)/2){ hit = true; break; }
      }
      if(!hit){
        for(let j=1;j<s.pts.length;j++){
          if(distToSeg(p, s.pts[j-1], s.pts[j]) <= r + (s.pts[j].w||2)/2){ hit = true; break; }
        }
      }
      if(hit){ strokes.splice(i,1); changed = true; }
    }
    if(changed){ redraw(); hasContent = strokes.length>0 || !!bgImage; }
  }

  function resize(){
    const rect = stage.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    cssW = rect.width; cssH = rect.height;
    canvas.width = Math.max(1, Math.round(rect.width * ratio));
    canvas.height = Math.max(1, Math.round(rect.height * ratio));
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(ratio, ratio);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = penColor;
    redraw();
  }
  resize();
  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(stage);

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  let lastP = null;
  let smoothW = 2.5;

  function targetWidth(e){
    if(eraser) return (e.pointerType==='pen') ? Math.max(14, e.pressure*26) : 18;
    return (e.pointerType==='pen') ? Math.max(1.4, Math.min(4.5, e.pressure*4.5)) : 2.5;
  }

  function applyMode(){
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = penColor;
  }

  function drawSegment(e){
    const p = pos(e);
    if(!lastP){ lastP = p; return; }
    if(eraser){ eraseAt(p); lastP = p; return; }
    smoothW += (targetWidth(e) - smoothW) * 0.35;
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = penColor;
    ctx.lineWidth = smoothW;
    ctx.beginPath();
    ctx.moveTo(lastP.x, lastP.y);
    const mid = { x:(lastP.x + p.x)/2, y:(lastP.y + p.y)/2 };
    ctx.quadraticCurveTo(lastP.x, lastP.y, mid.x, mid.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    if(curStroke) curStroke.pts.push({ x:p.x, y:p.y, w:smoothW });
    lastP = p;
  }

  function isStylusTouch(e){
    if(e.touches && e.touches.length){
      return e.touches[0].touchType === 'stylus';
    }
    if(e.changedTouches && e.changedTouches.length){
      return e.changedTouches[0].touchType === 'stylus';
    }
    return false;
  }

  let downP = null;
  let downBtn = null;
  let movedFar = false;
  let strokeActive = false;
  let lastStrokeAt = 0;
  const TAP_SLOP = 8;
  const PALM_GRACE = 500;

  function resetPtr(){ drawing = false; lastP = null; downBtn = null; downP = null; movedFar = false; curStroke = null; }

  function beginStroke(e, from){
    drawing = true;
    lastP = from || pos(e);
    smoothW = targetWidth(e);
    if(eraser){
      curStroke = null;
      eraseAt(lastP);
    } else {
      hasContent = true;
      curStroke = { color: penColor, pts: [{ x:lastP.x, y:lastP.y, w:smoothW }] };
      strokes.push(curStroke);
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = penColor;
      ctx.lineWidth = smoothW;
      ctx.beginPath();
      ctx.moveTo(lastP.x, lastP.y);
      ctx.lineTo(lastP.x + 0.01, lastP.y + 0.01);
      ctx.stroke();
    }
    if(canvas.setPointerCapture) { try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
  }

  canvas.addEventListener('selectstart', e=> e.preventDefault());
  const TAP_SEL = tapSelector;
  canvas.addEventListener('pointerdown', e=>{
    const els = document.elementsFromPoint(e.clientX, e.clientY);
    const btn = els.find(el => el.matches && el.matches(TAP_SEL) && !el.disabled);
    downP = pos(e);
    downBtn = btn || null;
    movedFar = false;

    if(e.pointerType === 'touch'){
      return;
    }
    strokeActive = true; lastStrokeAt = Date.now();
    e.preventDefault();
    if(btn){
      if(canvas.setPointerCapture) { try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
      return;
    }
    beginStroke(e, downP);
  });
  canvas.addEventListener('pointermove', e=>{
    if(e.pointerType === 'touch'){
      if(downBtn && downP){
        const p = pos(e);
        if(Math.hypot(p.x - downP.x, p.y - downP.y) > TAP_SLOP) downBtn = null;
      }
      return;
    }
    lastStrokeAt = Date.now();
    if(downBtn && !drawing){
      const p = pos(e);
      if(Math.hypot(p.x - downP.x, p.y - downP.y) > TAP_SLOP){
        movedFar = true; downBtn = null;
        beginStroke(e, downP);
      } else {
        return;
      }
    }
    if(!drawing) return;
    e.preventDefault();
    applyMode();
    const events = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    for(const ev of events) drawSegment(ev);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(evt=>{
    canvas.addEventListener(evt, (e)=>{
      const isTouch = e.pointerType === 'touch';
      if(evt === 'pointerup' && downBtn && !movedFar){
        if(isTouch){
          const writing = strokeActive || (Date.now() - lastStrokeAt < PALM_GRACE);
          if(!writing){ const b = downBtn; resetPtr(); activateTapTarget(b); return; }
        } else {
          const b = downBtn; strokeActive = false; lastStrokeAt = Date.now(); resetPtr(); activateTapTarget(b); return;
        }
      }
      if(!isTouch){ strokeActive = false; lastStrokeAt = Date.now(); }
      resetPtr();
    });
  });

  let touchStartY = null;
  canvas.addEventListener('touchstart', e=>{
    if(isStylusTouch(e)){ e.preventDefault(); return; }
    if(e.touches.length === 1) touchStartY = e.touches[0].clientY;
  }, { passive:false });
  canvas.addEventListener('touchmove', e=>{
    if(isStylusTouch(e)){ e.preventDefault(); return; }
    if(touchStartY === null || e.touches.length !== 1) return;
    const y = e.touches[0].clientY;
    window.scrollBy(0, touchStartY - y);
    touchStartY = y;
  }, { passive:false });
  canvas.addEventListener('touchend', e=>{
    if(isStylusTouch(e)){ e.preventDefault(); }
    touchStartY = null;
  }, { passive:false });

  return {
    clear(){ strokes = []; curStroke = null; bgImage = null; ctx.clearRect(0,0,canvas.width,canvas.height); hasContent = false; },
    hasDrawing(){ return hasContent; },
    getDataURL(){ return canvas.toDataURL('image/png'); },
    setColor(c){ penColor = c; eraser = false; },
    setEraser(){ eraser = true; },
    resizeNow(){ resize(); },
    stageSize(){ return {w:cssW, h:cssH}; }
  };
}

/* ===================== 문제 렌더링 & 채점 ===================== */
const TAP_SEL = '.choicebtn, .actbtn, .blankinput';

const quizState = {}; // prefix -> {pool, crossSubject, memo, question, answered}

function renderQuestion(prefix){
  const st = quizState[prefix];
  st.memo.clear();
  const q = generateQuestion(st.pool, st.crossSubject, st.typeFilter);
  st.question = q;
  st.answered = false;

  const area = document.getElementById(prefix + '-quizarea');
  let html = '<div class="typelabel">' + q.typeLabel + '</div>';
  html += '<div class="qprompt" id="' + prefix + '-prompt">' + q.promptHtml + '</div>';

  if(q.kind === 'choice'){
    html += '<div class="choicerow" id="' + prefix + '-choices">';
    q.choices.forEach((c,i)=>{
      html += '<button class="choicebtn" data-idx="' + i + '">' + escapeHtml(c.label) + '</button>';
    });
    html += '</div>';
  } else if(q.kind === 'unitinput'){
    html += '<div class="blankline" id="' + prefix + '-blankline">';
    html += '<input type="text" class="blankinput unitinput-field" id="' + prefix + '-unitinput" name="unitinput_' + prefix + '_' + Date.now() + '" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">';
    html += '</div>';
    html += '<div class="actionrow"><button class="actbtn primary" id="' + prefix + '-check">정답 확인</button>';
    if(st.crossSubject){
      html += '<button class="actbtn" id="' + prefix + '-hint">힌트 (과목명)</button>';
    }
    html += '</div>';
    html += '<div class="feedback" id="' + prefix + '-hintbox" style="display:none;"></div>';
  } else if(q.kind === 'blank'){
    html += '<div class="blankline" id="' + prefix + '-blankline">';
    q.parts.forEach(part=>{
      const m = part.match(/^\{\{BLANK(\d+)\}\}$/);
      if(m){
        const groupIdx = parseInt(m[1],10);
        const subs = q.answerGroups[groupIdx];
        html += '<span class="blankgroup" data-group="' + groupIdx + '">';
        subs.forEach((sub, subIdx)=>{
          html += '<input type="text" class="blankinput" data-idx="' + groupIdx + '" data-sub="' + subIdx + '" name="blank_' + prefix + '_' + groupIdx + '_' + subIdx + '_' + Date.now() + '" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">';
          if(subIdx < subs.length-1) html += '<span class="blanksep">,</span>';
        });
        html += '</span>';
      } else {
        html += escapeHtml(part);
      }
    });
    html += '</div>';
    html += '<div class="actionrow"><button class="actbtn primary" id="' + prefix + '-check">정답 확인</button></div>';
  }

  html += '<div class="feedback" id="' + prefix + '-feedback"></div>';
  html += '<div class="actionrow" id="' + prefix + '-actions" style="display:none;"><button class="actbtn primary" id="' + prefix + '-next">다음 문제</button></div>';

  area.innerHTML = html;

  if(q.kind === 'choice'){
    area.querySelectorAll('.choicebtn').forEach(btn=>{
      btn.addEventListener('click', ()=> handleChoiceAnswer(prefix, parseInt(btn.dataset.idx,10)));
    });
  } else if(q.kind === 'unitinput'){
    const checkBtn = document.getElementById(prefix + '-check');
    checkBtn.addEventListener('click', ()=> handleUnitInputAnswer(prefix));
    const inp = document.getElementById(prefix + '-unitinput');
    inp.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); handleUnitInputAnswer(prefix); }
    });
    inp.focus();
    const hintBtn = document.getElementById(prefix + '-hint');
    if(hintBtn){
      hintBtn.addEventListener('click', ()=>{
        const box = document.getElementById(prefix + '-hintbox');
        box.className = 'feedback show';
        box.innerHTML = '<div class="fbans">힌트: <b>' + escapeHtml(q.meta.unit.subjectName) + '</b> 과목입니다.</div>';
        box.style.display = 'block';
        hintBtn.disabled = true;
      });
    }
  } else {
    const checkBtn = document.getElementById(prefix + '-check');
    checkBtn.addEventListener('click', ()=> handleBlankAnswer(prefix));
    setupBlankTabNav(area, prefix);
  }

  const nextBtn = document.getElementById(prefix + '-next');
  nextBtn.addEventListener('click', ()=> renderQuestion(prefix));
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function handleChoiceAnswer(prefix, idx){
  const st = quizState[prefix];
  if(st.answered) return;
  st.answered = true;
  const q = st.question;
  const chosen = q.choices[idx];
  const area = document.getElementById(prefix + '-quizarea');
  area.querySelectorAll('.choicebtn').forEach((btn,i)=>{
    btn.disabled = true;
    if(q.choices[i].correct) btn.classList.add('correct');
    else if(i===idx) btn.classList.add('wrong');
  });
  showFeedback(prefix, chosen.correct, null);
  recordStat(q.meta.unit, chosen.correct);
  if(!chosen.correct){
    saveWrongNote(prefix, q, { kind:'choice', selectedLabel:chosen.label });
  }
  document.getElementById(prefix + '-actions').style.display = 'flex';
}

// 빈칸 입력들 사이를 Tab / Enter 로 순서대로 이동
function setupBlankTabNav(area, prefix){
  const inputs = Array.from(area.querySelectorAll('.blankinput'));
  function goTo(el){
    if(!el) return;
    setTimeout(()=>{ el.focus(); if(el.select) el.select(); }, 0);
  }
  inputs.forEach((inp, i)=>{
    inp.addEventListener('keydown', (e)=>{
      if(e.key === 'Tab'){
        e.preventDefault();
        e.stopPropagation();
        const next = e.shiftKey ? inputs[i-1] : inputs[i+1];
        if(next){ goTo(next); }
        else { const btn = document.getElementById(prefix + '-check'); if(btn) setTimeout(()=>btn.focus(),0); }
      } else if(e.key === 'Enter'){
        e.preventDefault();
        e.stopPropagation();
        const next = inputs[i+1];
        if(next){ goTo(next); }
        else { handleBlankAnswer(prefix); }
      }
    });
  });
  if(inputs.length) inputs[0].focus();
}

function subAnswerOk(userVal, correctSub){
  const nu = normalize(userVal), nc = normalize(correctSub);
  if(!nu) return false;
  return nu === nc || (nc.length>3 && nc.includes(nu) && nu.length >= nc.length*0.6);
}

function handleUnitInputAnswer(prefix){
  const st = quizState[prefix];
  if(st.answered) return;
  const q = st.question;
  const inp = document.getElementById(prefix + '-unitinput');
  const userVal = inp.value;
  const ok = subAnswerOk(userVal, q.correctAnswer);
  inp.disabled = true;
  inp.classList.add(ok ? 'correct' : 'wrong');
  st.answered = true;
  const checkBtn = document.getElementById(prefix + '-check');
  if(checkBtn) checkBtn.disabled = true;
  showFeedback(prefix, ok, [q.correctAnswer]);
  recordStat(q.meta.unit, ok);
  if(!ok){
    saveWrongNote(prefix, q, { kind:'unitinput', userAnswer:userVal });
  }
  document.getElementById(prefix + '-actions').style.display = 'flex';
}

function handleBlankAnswer(prefix){
  const st = quizState[prefix];
  if(st.answered) return;
  const q = st.question;
  const area = document.getElementById(prefix + '-quizarea');
  const inputs = Array.from(area.querySelectorAll('.blankinput'));
  let allCorrect = true;
  // userAnswers: 그룹별로 하위 입력값 배열을 저장 (예: [['지지도','신뢰도','향상도']])
  const userAnswers = q.answerGroups.map(g=> g.map(()=>''));
  inputs.forEach(inp=>{
    const gi = parseInt(inp.dataset.idx,10);
    const si = parseInt(inp.dataset.sub,10);
    const correctSub = q.answerGroups[gi][si];
    const ok = subAnswerOk(inp.value, correctSub);
    userAnswers[gi][si] = inp.value;
    inp.disabled = true;
    inp.classList.add(ok ? 'correct' : 'wrong');
    if(!ok) allCorrect = false;
  });
  st.answered = true;
  const checkBtn = document.getElementById(prefix + '-check');
  if(checkBtn) checkBtn.disabled = true;
  showFeedback(prefix, allCorrect, q.answers);
  recordStat(q.meta.unit, allCorrect);
  if(!allCorrect){
    saveWrongNote(prefix, q, { kind:'blank', userAnswers });
  }
  document.getElementById(prefix + '-actions').style.display = 'flex';
}

function showFeedback(prefix, correct, blankAnswers){
  const fb = document.getElementById(prefix + '-feedback');
  fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');
  let html = '<div class="fbtitle ' + (correct?'ok':'no') + '">' + (correct ? '✔ 정답입니다!' : '✘ 오답입니다.') + '</div>';
  if(blankAnswers){
    html += '<div class="fbans">정답: <b>' + blankAnswers.map(escapeHtml).join(', ') + '</b></div>';
  }
  fb.innerHTML = html;
}

/* ===================== 오답노트 저장/렌더 ===================== */
function saveWrongNote(prefix, q, answerInfo){
  const st = quizState[prefix];
  const memo = st.memo;
  const stage = memo.stageSize();
  const note = {
    id: 'n' + Date.now() + Math.floor(Math.random()*1000),
    date: new Date().toLocaleString('ko-KR'),
    typeLabel: q.typeLabel,
    promptHtml: q.promptHtml,
    kind: q.kind,
    stageW: stage.w, stageH: stage.h,
    memo: memo.hasDrawing() ? memo.getDataURL() : null
  };
  if(q.kind === 'choice'){
    note.choices = q.choices.map(c=>({label:c.label, correct:c.correct, selected:c.label===answerInfo.selectedLabel}));
  } else if(q.kind === 'unitinput'){
    note.correctAnswer = q.correctAnswer;
    note.userAnswer = answerInfo.userAnswer;
  } else {
    note.parts = q.parts;
    note.answers = q.answers;
    note.answerGroups = q.answerGroups;
    note.userAnswers = answerInfo.userAnswers; // 그룹별 하위 입력값 배열
  }
  storageGet('wrongnotes').then(list=>{
    list = list || [];
    list.unshift(note);
    if(list.length > 200) list = list.slice(0,200);
    storageSet('wrongnotes', list).then(()=> renderNotesTab());
  });
}

function renderNoteHtml(note){
  let inner = '<div class="typelabel">' + note.typeLabel + '</div>';
  inner += '<div class="qprompt">' + note.promptHtml + '</div>';
  if(note.kind === 'choice'){
    inner += '<div class="choicerow">';
    note.choices.filter(c=> c.correct || c.selected).forEach(c=>{
      let cls = 'choicebtn';
      if(c.correct) cls += ' correct';
      else if(c.selected) cls += ' wrong';
      inner += '<button class="' + cls + '" disabled>' + escapeHtml(c.label) + '</button>';
    });
    inner += '</div>';
  } else if(note.kind === 'unitinput'){
    const ok = normalize(note.userAnswer) === normalize(note.correctAnswer);
    inner += '<div class="blankline"><input type="text" class="blankinput ' + (ok?'correct':'wrong') + '" value="' + escapeHtml(note.userAnswer) + '" disabled></div>';
    inner += '<div class="feedback show correct" style="margin-top:10px;"><div class="fbans">정답: <b>' + escapeHtml(note.correctAnswer) + '</b></div></div>';
  } else {
    inner += '<div class="blankline">';
    note.parts.forEach(part=>{
      const m = part.match(/^\{\{BLANK(\d+)\}\}$/);
      if(m){
        const gi = parseInt(m[1],10);
        const subs = note.answerGroups[gi];
        inner += '<span class="blankgroup">';
        subs.forEach((correctSub, si)=>{
          const ua = (note.userAnswers[gi] && note.userAnswers[gi][si]) || '';
          const ok = normalize(ua) === normalize(correctSub);
          inner += '<input type="text" class="blankinput ' + (ok?'correct':'wrong') + '" value="' + escapeHtml(ua) + '" disabled>';
          if(si < subs.length-1) inner += '<span class="blanksep">,</span>';
        });
        inner += '</span>';
      } else {
        inner += escapeHtml(part);
      }
    });
    inner += '</div>';
    inner += '<div class="feedback show correct" style="margin-top:10px;"><div class="fbans">정답: <b>' + note.answers.map(escapeHtml).join(', ') + '</b></div></div>';
  }
  return inner;
}

async function renderNotesTab(){
  const list = (await storageGet('wrongnotes')) || [];
  document.getElementById('notes-count').textContent = list.length + '개';
  const container = document.getElementById('notes-list');
  if(!list.length){
    container.innerHTML = '<div class="empty">아직 틀린 문제가 없어요. 문제를 풀어보세요!</div>';
    return;
  }
  container.innerHTML = '';
  list.forEach(note=>{
    const item = document.createElement('div');
    item.className = 'noteitem';
    item.innerHTML =
      '<div class="nhead"><span class="ntype">' + note.typeLabel + '</span>' +
      '<span class="ndate">' + note.date + '</span>' +
      '<button class="ndel" data-id="' + note.id + '">삭제</button></div>' +
      '<div class="note-stage">' +
        (note.memo ? '<div class="nmemo-overlay"><img src="' + note.memo + '"></div>' : '') +
        '<div style="position:relative; z-index:1;">' + renderNoteHtml(note) + '</div>' +
      '</div></div>';
    container.appendChild(item);
  });
  container.querySelectorAll('.ndel').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      let l = (await storageGet('wrongnotes')) || [];
      l = l.filter(n=>n.id!==btn.dataset.id);
      await storageSet('wrongnotes', l);
      renderNotesTab();
    });
  });
}

/* ===================== 탭 전환 ===================== */
/* ===================== 통계 ===================== */
function recordStat(unit, correct){
  storageGet('stats').then(stats=>{
    stats = stats || { total:0, correct:0, bySubject:{} };
    stats.total++;
    if(correct) stats.correct++;
    const key = unit.subjectName;
    if(!stats.bySubject[key]) stats.bySubject[key] = { total:0, correct:0 };
    stats.bySubject[key].total++;
    if(correct) stats.bySubject[key].correct++;
    storageSet('stats', stats).then(()=>{
      if(document.getElementById('panel-stats').classList.contains('active')) renderStatsTab();
    });
  });
}

async function renderStatsTab(){
  const stats = (await storageGet('stats')) || { total:0, correct:0, bySubject:{} };
  const wrong = stats.total - stats.correct;
  const rate = stats.total ? Math.round(stats.correct / stats.total * 100) : 0;
  const summary = document.getElementById('stats-summary');
  summary.innerHTML =
    '<div class="statbox"><div class="snum">' + stats.total + '</div><div class="slabel">전체 풀이 수</div></div>' +
    '<div class="statbox ok"><div class="snum">' + stats.correct + '</div><div class="slabel">정답</div></div>' +
    '<div class="statbox bad"><div class="snum">' + wrong + '</div><div class="slabel">오답</div></div>' +
    '<div class="statbox"><div class="snum">' + rate + '%</div><div class="slabel">정답률</div></div>';

  const bySubject = document.getElementById('stats-bysubject');
  if(!stats.total){
    bySubject.innerHTML = '<div class="empty">아직 통계가 없어요. 문제를 풀어보세요!</div>';
    return;
  }
  bySubject.innerHTML = '';
  ALL_SUBJECT_NAMES.forEach(name=>{
    const s = stats.bySubject[name] || { total:0, correct:0 };
    const pct = s.total ? Math.round(s.correct / s.total * 100) : 0;
    const row = document.createElement('div');
    row.className = 'subjbar-row';
    row.innerHTML =
      '<div class="sname">' + name + '</div>' +
      '<div class="subjbar-track"><div class="subjbar-fill" style="width:' + pct + '%;"></div></div>' +
      '<div class="subjbar-count">' + s.correct + '/' + s.total + ' (' + pct + '%)</div>';
    bySubject.appendChild(row);
  });
}

document.getElementById('stats-reset').addEventListener('click', async ()=>{
  if(!confirm('통계를 전부 초기화할까요? 이 작업은 되돌릴 수 없습니다.')) return;
  await storageSet('stats', { total:0, correct:0, bySubject:{} });
  renderStatsTab();
});

document.querySelectorAll('.navlink').forEach(link=>{
  link.addEventListener('click', ()=>{
    document.querySelectorAll('.navlink').forEach(l=>l.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));

    if(link.dataset.tab === 'all' && quizState.all) quizState.all.memo.resizeNow();
    if(link.dataset.tab === 'subject' && quizState.subj) quizState.subj.memo.resizeNow();
  });
});

function setupPenToolbar(containerId, memo){
  const container = document.getElementById(containerId);
  container.querySelectorAll('.pen-color').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      container.querySelectorAll('.pen-color').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      if(btn.dataset.color === 'eraser') memo.setEraser();
      else memo.setColor(btn.dataset.color);
    });

}

/* ===================== 유형 소탭 공용 ===================== */
const TYPE_TABS = [
  {id:'ALL', label:'전체 유형', title:'모든 유형을 섞어서 출제'},
  {id:'A', label:'A · 단원', title:'유형 A · 내용 요소 ↔ 단원 맞히기'},
  {id:'B', label:'B · 아이디어', title:'유형 B · 핵심 아이디어로 단원 분류하기'},
  {id:'C', label:'C · 빈칸', title:'유형 C · 문장 빈칸 채우기'},
  {id:'D', label:'D · 코드', title:'유형 D · 성취기준 코드 매칭'}
];
function renderTypeTabsInto(container, currentValue, onSelect){
  container.innerHTML = '';
  TYPE_TABS.forEach(t=>{
    const btn = document.createElement('div');
    btn.className = 'typetab' + (t.id===currentValue ? ' active' : '');
    btn.textContent = t.label;
    btn.title = t.title;
    btn.addEventListener('click', ()=>{
      if(currentValue === t.id) return;
      onSelect(t.id);
    });
    container.appendChild(btn);
  });
}

/* ===================== 전체 범위 탭 초기화 ===================== */
const allMemo = setupMemoCanvas('all-memo-canvas', 'all-memo-stage', TAP_SEL);
setupPenToolbar('all-pen-colors', allMemo);
document.getElementById('all-memo-clear').addEventListener('click', ()=> allMemo.clear());

const allTypeSelector = document.getElementById('all-type-selector');
let currentAllTypeFilter = 'ALL';
function renderAllTypeTabs(){
  renderTypeTabsInto(allTypeSelector, currentAllTypeFilter, (id)=>{
    currentAllTypeFilter = id;
    renderAllTypeTabs();
    loadAllQuiz();
  });
}

const allSubjToggleBtn = document.getElementById('all-subj-toggle-btn');
const allSubjDropdown = document.getElementById('all-subj-dropdown');
let allSelectedSubjectIds = new Set(DATA.map(s=>s.id));

function renderAllSubjectToggle(){
  const label = allSelectedSubjectIds.size === DATA.length
    ? '전체 범위'
    : DATA.filter(s=>allSelectedSubjectIds.has(s.id)).map(s=> SUBJECT_ABBR[s.id] || s.name).join(', ');
  allSubjToggleBtn.innerHTML = escapeHtml(label) + '<span class="subj-toggle-caret">▾</span>';
  allSubjToggleBtn.title = '출제 범위 선택 (여러 개 선택 가능)';

  allSubjDropdown.innerHTML = '';
  DATA.forEach(s=>{
    const checked = allSelectedSubjectIds.has(s.id);
    const item = document.createElement('div');
    item.className = 'subj-dropdown-item multi' + (checked ? ' active' : '');
    item.innerHTML = '<span class="chk"></span><span>' + escapeHtml(s.name) + '</span>';
    item.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(allSelectedSubjectIds.has(s.id)){
        if(allSelectedSubjectIds.size === 1) return; // 최소 1개는 선택되어 있어야 함
        allSelectedSubjectIds.delete(s.id);
      }else{
        allSelectedSubjectIds.add(s.id);
      }
      renderAllSubjectToggle();
      loadAllQuiz();
    });
    allSubjDropdown.appendChild(item);
  });
}
allSubjToggleBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  allSubjDropdown.classList.toggle('open');
});
document.addEventListener('click', (e)=>{
  if(!allSubjDropdown.classList.contains('open')) return;
  if(allSubjToggleBtn.contains(e.target) || allSubjDropdown.contains(e.target)) return;
  allSubjDropdown.classList.remove('open');
});

function loadAllQuiz(){
  const typeFilter = currentAllTypeFilter === 'ALL' ? null : currentAllTypeFilter;
  const pool = ALL_UNITS.filter(u=> allSelectedSubjectIds.has(u.subjectId));
  quizState.all = { pool, crossSubject: allSelectedSubjectIds.size > 1, memo: allMemo, answered:false, typeFilter };
  renderQuestion('all');
}
renderAllTypeTabs();
renderAllSubjectToggle();
loadAllQuiz();

document.getElementById('subj-memo-clear').addEventListener('click', ()=> subjMemo.clear());

const subjDropdown = document.getElementById('subj-dropdown');

let currentSubjectId = DATA[0].id;
let currentTypeFilter = 'ALL';

function renderSubjectToggle(){
  const subj = DATA.find(s=>s.id===currentSubjectId);
  subjToggleBtn.innerHTML = escapeHtml(SUBJECT_ABBR[subj.id] || subj.name) + '<span class="subj-toggle-caret">▾</span>';
  subjToggleBtn.title = subj.name;

  subjDropdown.innerHTML = '';

    const item = document.createElement('div');
    item.className = 'subj-dropdown-item' + (s.id===currentSubjectId ? ' active' : '');

      currentSubjectId = s.id;

      loadSubjectQuiz();

    subjDropdown.appendChild(item);
  });

subjToggleBtn.addEventListener('click', (e)=>{

  subjDropdown.classList.toggle('open');
});
document.addEventListener('click', (e)=>{
  if(!subjDropdown.classList.contains('open')) return;
  if(subjToggleBtn.contains(e.target) || subjDropdown.contains(e.target)) return;
  subjDropdown.classList.remove('open');
});

function renderTypeTabs(){
  renderTypeTabsInto(typeSelectorTabs, currentTypeFilter, (id)=>{
    currentTypeFilter = id;
    renderTypeTabs();
    loadSubjectQuiz();
  });
}
function loadSubjectQuiz(){
  const subj = DATA.find(s=>s.id===currentSubjectId);
  const pool = subj.units.map(u=> Object.assign({}, u, {subjectId:subj.id, subjectName:subj.name}));
  const typeFilter = currentTypeFilter === 'ALL' ? null : currentTypeFilter;
  quizState.subj = { pool, crossSubject:false, memo: subjMemo, answered:false, typeFilter };
  renderQuestion('subj');
}
renderSubjectToggle();
renderTypeTabs();
loadSubjectQuiz();

/* 초기 오답노트 카운트 표시 */
renderNotesTab();
renderStatsTab();
</script>
